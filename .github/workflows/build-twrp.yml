name: Build TWRP (Galaxy A01 Core)

on:
  workflow_dispatch:
    inputs:
      device_repo:
        description: "Repositório da device tree"
        default: "https://github.com/almondnguyen/twrp_device_samsung_a01core"
        required: true
      device_branch:
        description: "Branch da device tree"
        default: "twrp-11"
        required: true
      manifest_branch:
        description: "Branch do manifest do TWRP"
        default: "twrp-11"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Criar swap (extra de memória)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 libncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            bc lz4 libssl-dev rsync ccache openjdk-11-jdk-headless
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configurar git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Baixar código-fonte do TWRP
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${{ github.event.inputs.manifest_branch }}"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Clonar a device tree
        run: |
          cd ~/twrp
          git clone --depth=1 \
            -b "${{ github.event.inputs.device_branch }}" \
            "${{ github.event.inputs.device_repo }}" \
            device/samsung/a01core
          ls device/samsung/a01core
          cat device/samsung/a01core/twrp.dependencies || true

      - name: Compilar recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          set +u
          source build/envsetup.sh
          lunch twrp_a01core-eng
          make -j"$(nproc)" recoveryimage

      - name: Preparar arquivos de saída
        run: |
          OUT=~/twrp/out/target/product/a01core
          mkdir -p ~/artifacts
          cp "$OUT/recovery.img" ~/artifacts/
          cd ~/artifacts
          tar -H ustar -c recovery.img > recovery.tar
          sha256sum recovery.img recovery.tar | tee SHA256SUMS.txt
          ls -lh

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a01core
          path: ~/artifacts/*
          if-no-files-found: error
