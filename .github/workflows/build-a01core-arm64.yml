name: A01 Core ARM64 kernel feasibility build

on:
  push:
    paths:
      - ".github/workflows/build-a01core-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            git libelf-dev libncurses-dev libssl-dev make python3
          df -h /

      - name: Fetch A01 Core kernel source
        run: |
          git clone --depth=1 --branch master \
            https://github.com/almondnguyen/android_kernel_samsung_a01core.git kernel
          cd kernel
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Configure ARM64 MT6739 build
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable ARCH_MEDIATEK
          scripts/config --enable MACH_MT6739
          scripts/config --enable COMMON_CLK_MT6739
          scripts/config --enable MEDIATEK_SOLUTION          # Match the A01 Core target PMIC stack (MT6357), not generic ARM64 defaults.
          scripts/config --enable MTK_PMIC_NEW_ARCH
          scripts/config --enable MTK_PMIC_COMMON
          scripts/config --enable MTK_PMIC_CHIP_MT6357
          scripts/config --enable MTK_PMIC_WRAP_HAL
          scripts/config --enable MTK_PMIC_WRAP
          scripts/config --set-str MTK_PLATFORM "mt6739"
          scripts/config --enable MTK_RAM_CONSOLE
          scripts/config --enable UCLAMP_TASK
          scripts/config --enable UCLAMP_TASK_GROUP
          scripts/config --enable UCLAMP_MAP_OPP
          scripts/config --enable SCHED_TUNE
          scripts/config --disable COMMON_CLK_MT6797
          scripts/config --disable COMMON_CLK_MT8173
          scripts/config --disable COMMON_CLK_MT8183
          scripts/config --disable COMMON_CLK_MT8168
          scripts/config --disable MOUSE_PS2_SYNAPTICS
          scripts/config --disable MOUSE_PS2_SYNAPTICS_SMBUS
          scripts/config --disable SEC_DEBUG
          grep -q 'mt6739.dtb' arch/arm64/boot/dts/mediatek/Makefile || \
            sed -i '/dtb-$(CONFIG_ARCH_MEDIATEK) += mt6797-evb.dtb/a dtb-$(CONFIG_ARCH_MEDIATEK) += mt6739.dtb' \
              arch/arm64/boot/dts/mediatek/Makefile
          # Work around the empty vendor DTBO config generator case.
          sed -i 's|rm -f .@.tmp|rm -f $@.tmp; touch $@.tmp|' scripts/drvgen/drvgen.mk
          # This call site omitted the third argument required by the tree's API.
          sed -i 's/try_to_unmap(page, ttu_flags);/try_to_unmap(page, ttu_flags, NULL);/' mm/huge_memory.c
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # olddefconfig re-enables unrelated MediaTek clock drivers via defaults.
          # Disable drivers absent from this tree / unrelated to the MT6739 target.
          for symbol in COMMON_CLK_MT8168 COMMON_CLK_MT8183; do
            scripts/config --disable "$symbol"
          done
          if ! grep -q '^CONFIG_MTK_PMIC_COMMON=y$' .config || ! grep -q '^CONFIG_MTK_PMIC_CHIP_MT6357=y$' .config; then
            echo "A01 Core MT6357 PMIC configuration is missing" >&2
            exit 1
          fi          if grep -Eq '^CONFIG_(COMMON_CLK_MT8168|COMMON_CLK_MT8183)=y$' .config; then
            echo "Unrelated MediaTek clock driver remained enabled" >&2
            exit 1
          fi
          {
            echo "## Kernel configuration"
            grep -E '^(CONFIG_ARM64|CONFIG_ARCH_MEDIATEK|CONFIG_MACH_MT6739|CONFIG_COMMON_CLK_MT6739|CONFIG_COMMON_CLK_MT6797|CONFIG_COMMON_CLK_MT8173|CONFIG_COMMON_CLK_MT8183|CONFIG_MEDIATEK_SOLUTION|CONFIG_MTK_PLATFORM|CONFIG_MTK_RAM_CONSOLE|CONFIG_UCLAMP_TASK|CONFIG_UCLAMP_TASK_GROUP|CONFIG_UCLAMP_MAP_OPP|CONFIG_SCHED_TUNE|CONFIG_MOUSE_PS2_SYNAPTICS|CONFIG_SEC_DEBUG)=' .config || true
            echo
            echo "Source commit: $SOURCE_COMMIT"
          } | tee ../configuration-summary.txt

      - name: Compile ARM64 Image and device trees
        working-directory: kernel
        run: |
          set +e
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error=array-bounds -Wno-error=sizeof-array-div -Wno-error=stringop-overflow -Wno-error=maybe-uninitialized" Image dtbs > ../arm64-build.log 2>&1
          result=$?
          set -e
          echo "BUILD_EXIT_CODE=$result" >> "$GITHUB_ENV"
          tail -n 100 ../arm64-build.log
          exit "$result"

      - name: Collect build evidence
        if: always()
        run: |
          mkdir -p artifacts
          cp -f arm64-build.log artifacts/ 2>/dev/null || true
          cp -f configuration-summary.txt artifacts/ 2>/dev/null || true
          if [ -f kernel/.config ]; then cp kernel/.config artifacts/arm64.config; fi
          if [ -f kernel/arch/arm64/boot/Image ]; then
            cp kernel/arch/arm64/boot/Image artifacts/Image-arm64
            file artifacts/Image-arm64
            sha256sum artifacts/Image-arm64 > artifacts/SHA256SUMS.txt
          fi
          if [ -f kernel/arch/arm64/boot/dts/mediatek/mt6739.dtb ]; then
            cp kernel/arch/arm64/boot/dts/mediatek/mt6739.dtb artifacts/
            file artifacts/mt6739.dtb
          fi
          {
            echo "Build exit code: ${BUILD_EXIT_CODE:-not-started}"
            echo "Source commit: ${SOURCE_COMMIT:-unknown}"
            echo "Note: generic MT6739 DTB only; not a device-specific A013M DTB."
          } > artifacts/RESULT.txt
          ls -lh artifacts

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01core-arm64-kernel-feasibility
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 7
